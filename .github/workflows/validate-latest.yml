name: validate-latest

# Chạy hằng tuần với Claude Code bản mới nhất để biết sớm khi validator đổi luật.
# Không chặn merge; khi đỏ thì cập nhật phiên bản ghim trong ci.yml.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'HVN-GROUP/hvn-ai-marketplace-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: |
          npx -y @anthropic-ai/claude-code@latest --version
          npx -y @anthropic-ai/claude-code@latest plugin validate .
          for dir in plugins/*/; do npx -y @anthropic-ai/claude-code@latest plugin validate "$dir"; done
