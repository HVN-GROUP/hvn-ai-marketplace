name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Không secret, chỉ đọc: PR từ fork không thể lấy được gì.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build và kiểm tra file sinh tự động không bị sửa tay
        run: |
          npm run build
          git status --porcelain -- plugins .claude-plugin
          test -z "$(git status --porcelain -- plugins .claude-plugin)"
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: claude plugin validate (phiên bản ghim, không cần đăng nhập)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.306 plugin validate .
          for dir in plugins/*/; do npx -y @anthropic-ai/claude-code@2.1.306 plugin validate "$dir"; done
