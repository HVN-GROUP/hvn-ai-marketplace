name: deploy

# Merge vào main → build image (tag = git SHA và `staging`) → Coolify deploy staging → smoke test.
# Production chỉ chạy khi bấm tay Run workflow với production_sha: gói Team không có người duyệt bắt buộc
# cho environment của repo riêng tư, nên nút bấm tay là bước duyệt. Rollback = chạy lại với SHA cũ.
# main chỉ nhận commit đã qua CI (ruleset), nên deploy không chạy lại test.
# Hai environment staging/production phải giới hạn "Deployment branches" = main (docs/thiet-lap-repo.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_sha:
        description: 'Mã commit (40 ký tự) đã chạy tốt trên staging để đưa lên production. Để trống: chỉ build và deploy staging.'
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hvn-group/hvn-ai-mcp

jobs:
  image:
    if: github.repository == 'HVN-GROUP/hvn-ai-marketplace-staging' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.production_sha == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build và push image theo SHA, gắn tag staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:staging" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:staging"

  staging:
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Coolify deploy staging
        env: { COOLIFY_URL: '${{ vars.COOLIFY_URL }}', COOLIFY_TOKEN: '${{ secrets.COOLIFY_TOKEN }}', COOLIFY_APP_UUID: '${{ vars.COOLIFY_APP_UUID }}' }
        run: sh deploy/coolify-deploy.sh
      - run: sh deploy/smoke.sh "${{ vars.MCP_BASE_URL }}"

  production:
    if: github.repository == 'HVN-GROUP/hvn-ai-marketplace-staging' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.production_sha != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Gắn tag production cho image của ${{ inputs.production_sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.production_sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::production_sha phải là mã commit đủ 40 ký tự"; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Chỉ commit trên main mới có image theo SHA, vì job image chỉ chạy trên main.
          docker buildx imagetools create -t "$IMAGE:production" "$IMAGE:$SHA"
      - name: Coolify deploy production
        env: { COOLIFY_URL: '${{ vars.COOLIFY_URL }}', COOLIFY_TOKEN: '${{ secrets.COOLIFY_TOKEN }}', COOLIFY_APP_UUID: '${{ vars.COOLIFY_APP_UUID }}' }
        run: sh deploy/coolify-deploy.sh
      - run: sh deploy/smoke.sh "${{ vars.MCP_BASE_URL }}"
